[package]
name = "aiosmb-compression"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "Safe Rust SMB compression codecs for Python"
license = "Apache-1.1"
readme = "README.md"
repository = "https://github.com/skelsec/aiosmb"
keywords = ["compression", "smb", "xpress", "lz4", "python"]
categories = ["compression", "api-bindings"]

[lib]
name = "aiosmb_compression"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
proptest = "1.11.0"

[[bench]]
name = "lz77"
harness = false

[[bench]]
name = "codecs"
harness = false

[package]
name = "aiosmb-compression-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
aiosmb-compression = { path = ".." }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "decode"

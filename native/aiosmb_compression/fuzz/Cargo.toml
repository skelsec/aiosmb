test = false
doc = false
bench = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_all"
path = "fuzz_targets/decode_all.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip_all"
path = "fuzz_targets/round_trip_all.rs"
test = false
doc = false
bench = false

[global]
    server role = standalone server
    workgroup = @WORKGROUP@
    netbios name = AIOSMB-LAB
    security = user

    server min protocol = SMB2_02
    server max protocol = SMB3_11
    server signing = auto
    ntlm auth = ntlmv2-only
    map to guest = Never

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    log file = /dev/stdout
    log level = 1
    max log size = 0

[@SHARE@]
    path = /srv/samba/interop
    browseable = yes
    read only = no
    guest ok = no
    force create mode = 0600
    force directory mode = 0700
    vfs objects = acl_xattr
    map acl inherit = yes
    store dos attributes = yes

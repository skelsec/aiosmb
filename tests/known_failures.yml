schema_version: 1

schema:
  entry_required:
    - id
    - title
    - status
    - classification
    - canonical_test
    - affected_profiles
    - evidence
    - blocked_by
    - blocks
  id_pattern: "^KF-[0-9]{4}$"
  status_values:
    - confirmed
    - planned
    - resolved
  classification_values:
    - production_defect
    - planned_feature
    - environment
  notes:
    canonical_test: "One strict-xfail node ID reproducing the root issue."
    affected_profiles: "List dialects, operating systems, roles, and capabilities."
    evidence: "Sanitized expected/actual behavior and non-secret references."
    blocked_by: "Known-failure IDs that prevent this case from running."
    blocks: "Downstream known-failure IDs sharing this root blocker."

# This example documents the shape only; it is not an active known failure.
example_entry:
  id: KF-0000
  title: Example short defect title
  status: confirmed
  classification: production_defect
  canonical_test: tests/unit/test_example.py::test_minimal_reproducer
  affected_profiles:
    dialects:
      - SMB311
    operating_systems:
      - example-only
    roles:
      - member_server
    capabilities:
      - example_capability
  evidence:
    observed_on: "YYYY-MM-DD"
    expected: Sanitized expected behavior
    actual: Sanitized observed behavior
    references:
      - example-only
  blocked_by: []
  blocks:
    - KF-0001
  notes: Do not copy credentials, hostnames, packet captures, or secrets here.

